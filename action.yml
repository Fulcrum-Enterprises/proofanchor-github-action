name: "ProofLedger — Timestamp Release"
description: "Anchor a SHA-256 hash of your release artifact to the Polygon and Bitcoin blockchains via ProofLedger. Your file never leaves the runner."
author: "Craig Solomon / Fulcrum Enterprises LLC"

branding:
  icon: "shield"
  color: "blue"

inputs:
  api-key:
    description: "ProofLedger API key (starts with sk_). Issued from Account > API Keys on the BUSINESS plan."
    required: true
  file:
    description: "Path to the file to timestamp (e.g. dist/app.zip). Mutually exclusive with 'hash'."
    required: false
  hash:
    description: "Pre-computed SHA-256 hash to anchor. Mutually exclusive with 'file'."
    required: false
  filename:
    description: "Label for the proof, shown in your ProofLedger dashboard. Defaults to the filename or 'Release <tag>'."
    required: false
  bitcoin:
    description: "Also queue the proof for Bitcoin anchoring (Merkle-batched daily). Polygon anchoring happens either way."
    required: false
    default: "false"
  api-url:
    description: "ProofLedger API base URL (override for staging)."
    required: false
    default: "https://proofledger.io"
  add-to-release:
    description: "Add proof details to the GitHub release body (true/false)."
    required: false
    default: "true"

outputs:
  proof-id:
    description: "ProofLedger proof ID"
    value: ${{ steps.anchor.outputs.proof-id }}
  hash:
    description: "SHA-256 hash that was anchored"
    value: ${{ steps.anchor.outputs.hash }}
  verify-url:
    description: "Public verification API URL for this hash"
    value: ${{ steps.anchor.outputs.verify-url }}
  status:
    description: "Polygon anchoring status (ANCHORED or PENDING)"
    value: ${{ steps.anchor.outputs.status }}
  evidence-readiness:
    description: "Evidence readiness reported by ProofLedger (e.g. READY_POLYGON, READY_BITCOIN)"
    value: ${{ steps.anchor.outputs.evidence-readiness }}

runs:
  using: "composite"
  steps:
    - name: Compute or validate hash
      id: hash
      shell: bash
      run: |
        if [ -n "${{ inputs.file }}" ] && [ -n "${{ inputs.hash }}" ]; then
          echo "::error::Specify either 'file' or 'hash', not both."
          exit 1
        fi

        if [ -z "${{ inputs.file }}" ] && [ -z "${{ inputs.hash }}" ]; then
          echo "::error::You must specify either 'file' or 'hash'."
          exit 1
        fi

        if [ -n "${{ inputs.file }}" ]; then
          if [ ! -f "${{ inputs.file }}" ]; then
            echo "::error::File not found: ${{ inputs.file }}"
            exit 1
          fi
          HASH=$(sha256sum "${{ inputs.file }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Computed SHA-256: $HASH"
        else
          HASH="${{ inputs.hash }}"
          if ! echo "$HASH" | grep -qE '^[a-fA-F0-9]{64}$'; then
            echo "::error::Invalid SHA-256 hash format: $HASH"
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Using provided SHA-256: $HASH"
        fi

    - name: Determine proof label
      id: label
      shell: bash
      run: |
        if [ -n "${{ inputs.filename }}" ]; then
          echo "filename=${{ inputs.filename }}" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ inputs.file }}" ]; then
          echo "filename=$(basename '${{ inputs.file }}')" >> "$GITHUB_OUTPUT"
        elif [ -n "$GITHUB_REF_NAME" ]; then
          echo "filename=Release $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "filename=GitHub Action proof" >> "$GITHUB_OUTPUT"
        fi

    - name: Anchor proof via ProofLedger API
      id: anchor
      shell: bash
      env:
        PL_API_KEY: ${{ inputs.api-key }}
        PL_API_URL: ${{ inputs.api-url }}
        PL_HASH: ${{ steps.hash.outputs.hash }}
        PL_FILENAME: ${{ steps.label.outputs.filename }}
        PL_BITCOIN: ${{ inputs.bitcoin }}
      run: |
        if [ "$PL_BITCOIN" = "true" ]; then BTC=true; else BTC=false; fi

        BODY=$(jq -n \
          --arg hash "$PL_HASH" \
          --arg filename "$PL_FILENAME" \
          --argjson bitcoin "$BTC" \
          '{sha256: $hash, filename: $filename, bitcoin_requested: $bitcoin}')

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${PL_API_URL}/api/v1/proof" \
          -H "Authorization: Bearer ${PL_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "$BODY")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
          echo "::error::ProofLedger rejected the API key (HTTP $HTTP_CODE). API keys start with sk_ and are issued from Account > API Keys on the BUSINESS plan."
          exit 1
        fi

        if [ "$HTTP_CODE" = "429" ]; then
          echo "::error::ProofLedger monthly proof limit reached (HTTP 429): $BODY"
          exit 1
        fi

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "::error::ProofLedger API returned HTTP $HTTP_CODE: $BODY"
          exit 1
        fi

        PROOF_ID=$(echo "$BODY" | jq -r '.id // .proof.id // empty')
        POLY=$(echo "$BODY" | jq -r '.polygon_status // .proof.polygon_status // "PENDING"')
        READY=$(echo "$BODY" | jq -r '.evidence_readiness // .proof.evidence_readiness // empty')
        VERIFY_URL="${PL_API_URL}/api/v1/verify?hash=${PL_HASH}"

        echo "proof-id=$PROOF_ID" >> "$GITHUB_OUTPUT"
        echo "hash=$PL_HASH" >> "$GITHUB_OUTPUT"
        echo "verify-url=$VERIFY_URL" >> "$GITHUB_OUTPUT"
        echo "status=$POLY" >> "$GITHUB_OUTPUT"
        echo "evidence-readiness=$READY" >> "$GITHUB_OUTPUT"

        {
          echo "### ProofLedger Timestamp"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| **SHA-256** | \`$PL_HASH\` |"
          echo "| **Proof ID** | \`$PROOF_ID\` |"
          echo "| **Polygon** | $POLY |"
          if [ -n "$READY" ]; then echo "| **Evidence readiness** | $READY |"; fi
          echo "| **Verify (API)** | \`GET $VERIFY_URL\` |"
          echo ""
          echo "Anyone can verify this hash without a ProofLedger account, or offline with the \`verify-proof\` package on PyPI."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Append to release body
      if: inputs.add-to-release == 'true' && github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERIFY_URL: ${{ steps.anchor.outputs.verify-url }}
        PL_HASH: ${{ steps.anchor.outputs.hash }}
        PROOF_ID: ${{ steps.anchor.outputs.proof-id }}
      run: |
        CURRENT_BODY=$(gh api "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" --jq '.body')

        PROOF_BLOCK=$(cat <<BLOCK

        ---

        **Blockchain timestamp.** This release artifact's SHA-256 hash was anchored to Polygon at publish time via [ProofLedger](https://proofledger.io).
        SHA-256: \`${PL_HASH}\`
        Proof ID: \`${PROOF_ID}\`
        Verify: \`curl "${VERIFY_URL}"\` (no account required)
        BLOCK
        )

        UPDATED_BODY="${CURRENT_BODY}${PROOF_BLOCK}"

        gh api "repos/${{ github.repository }}/releases/${{ github.event.release.id }}" \
          -X PATCH \
          -f body="$UPDATED_BODY"

        echo "Release body updated with proof details."
